<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de gestão imobiliária Marcelo Bonifácio">
  <meta name="theme-color" content="#020B22">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MB Gestão">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Marcelo Bonifácio - Gestão</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#020B22">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // O video_player web só zera o volume; o navegador exige o atributo
    // `muted` para liberar o autoplay do vídeo de abertura.
    (function () {
      var originalPlay = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function () {
        if (this.currentSrc && this.currentSrc.indexOf('splash_marcelo_bonifacio') !== -1) {
          this.muted = true;
          this.setAttribute('playsinline', '');
        }
        return originalPlay.apply(this, arguments);
      };
    })();
  </script>
  <script>
    // Instalação do app (PWA) no Android: o Chrome oferece o convite
    // (beforeinstallprompt), que o menu "Baixar app" abre quando o usuário
    // pede.
    (function () {
      var convite = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        convite = e;
      });
      window.addEventListener('appinstalled', function () {
        convite = null;
      });
      window.mbInstalacaoDisponivel = function () {
        return convite !== null;
      };
      window.mbInstalarApp = async function () {
        if (!convite) return 'indisponivel';
        var c = convite;
        convite = null;
        await c.prompt();
        var escolha = await c.userChoice;
        return escolha.outcome;
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
